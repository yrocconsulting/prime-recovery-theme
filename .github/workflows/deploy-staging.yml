name: Deploy theme to SiteGround staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # SiteGround-generated keys carry a passphrase; strip it on the runner so rsync can run non-interactively.
          if [ -n "$SG_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SG_SSH_PASSPHRASE" -N "" -f ~/.ssh/id_ed25519 > /dev/null
          fi
          # Fails here if the key is malformed or passphrase-protected; prints the public key fingerprint (safe to share) to compare with SiteGround.
          ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub
          ssh-keyscan -p "${{ secrets.SG_SSH_PORT }}" "${{ secrets.SG_SSH_HOST }}" >> ~/.ssh/known_hosts

      # Only the theme folder is synced. Nothing outside wp-content/themes/prime-recovery is touched.
      - name: Rsync theme to staging
        run: |
          rsync -avz --delete \
            --exclude '.git*' --exclude '.github' --exclude 'node_modules' --exclude 'README.md' \
            -e "ssh -p ${{ secrets.SG_SSH_PORT }} -i ~/.ssh/id_ed25519" \
            ./theme/ \
            "${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}:${{ secrets.SG_THEME_PATH }}/"
